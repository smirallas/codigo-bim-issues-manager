name: issues-manager-e00
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      ISSUES_DATABASE_URL: sqlite+pysqlite:////workspace/apps/api/data/issues.db
      APS_CLIENT_ID: ${APS_CLIENT_ID:-}
      APS_CLIENT_SECRET: ${APS_CLIENT_SECRET:-}
      APS_CALLBACK_URL: ${APS_CALLBACK_URL:-http://127.0.0.1:8000/auth/autodesk/callback}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://127.0.0.1:5173}
      ACCESS_ALLOWED_EMAILS: ${ACCESS_ALLOWED_EMAILS:-}
      ACCESS_ALLOWED_DOMAINS: ${ACCESS_ALLOWED_DOMAINS:-}
      ISSUES_TOKEN_ENCRYPTION_KEY: ${ISSUES_TOKEN_ENCRYPTION_KEY:-}
      ISSUES_COOKIE_SECURE: ${ISSUES_COOKIE_SECURE:-false}
      ISSUES_SESSION_TTL_SECONDS: ${ISSUES_SESSION_TTL_SECONDS:-28800}
      ISSUES_MCP_INTERNAL_SECRET: ${ISSUES_MCP_INTERNAL_SECRET:-}
      ISSUES_MCP_ISSUER: ${ISSUES_MCP_ISSUER:-http://127.0.0.1:8001}
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["api-data:/workspace/apps/api/data"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build:
      context: .
      dockerfile: Dockerfile.node
      target: web
    environment:
      API_BASE_URL: http://api:8000
    ports: ["127.0.0.1:5173:5173"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.node
      target: mcp
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8001"
      MCP_DATA_MODE: ${MCP_DATA_MODE:-disabled}
      ISSUES_MCP_ISSUER: ${ISSUES_MCP_ISSUER:-http://127.0.0.1:8001}
      ISSUES_MCP_INTERNAL_SECRET: ${ISSUES_MCP_INTERNAL_SECRET:-}
      MCP_STORAGE_KEY: ${MCP_STORAGE_KEY:-}
      MCP_STORAGE_FILE: /workspace/apps/mcp/data/oauth.db
      WEB_ORIGIN: ${WEB_ORIGIN:-http://127.0.0.1:5173}
      MCP_CLIENT_ID: ${MCP_CLIENT_ID:-}
      MCP_CLIENT_REDIRECT_URI: ${MCP_CLIENT_REDIRECT_URI:-}
      API_BASE_URL: http://api:8000
      MCP_ALLOWED_HOSTS: 127.0.0.1,localhost,mcp
      MCP_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:8001,http://localhost:8001
    ports: ["127.0.0.1:8001:8001"]
    volumes: ["mcp-data:/workspace/apps/mcp/data"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  api-data:
  mcp-data:
