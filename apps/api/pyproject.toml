[project]
name = "issue-manager-api"
version = "0.0.0"
requires-python = ">=3.12.13,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.34.2",
  "sqlalchemy==2.0.40",
  "pydantic-settings==2.9.1",
  "authlib==1.9.1",
  "cryptography==50.0.0",
  "alembic==1.15.2",
  "httpx==0.28.1",
  "openpyxl==3.1.5",
  "defusedxml==0.7.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = "../../.cache/pytest"
addopts = "--basetemp=../../.cache/pytest-temp"
